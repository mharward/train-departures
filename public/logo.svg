<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <!-- Gradient matching the app background -->
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6cf7"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
    <linearGradient id="roofGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b52cc"/>
      <stop offset="100%" style="stop-color:#5b21b6"/>
    </linearGradient>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#14b8a6"/>
    </linearGradient>
  </defs>

  <!-- Perspective tracks -->
  <polygon points="8,26 2,32 5,32 10,26" fill="#64748b" opacity="0.6"/>
  <polygon points="20,26 26,32 23,32 18,26" fill="#64748b" opacity="0.6"/>
  <!-- Sleepers -->
  <line x1="7" y1="28" x2="21" y2="28" stroke="#78716c" stroke-width="1.5" opacity="0.5"/>
  <line x1="4" y1="31" x2="24" y2="31" stroke="#78716c" stroke-width="1.5" opacity="0.5"/>

  <!-- Train body with app gradient -->
  <rect x="4" y="4" width="20" height="22" rx="4" fill="url(#trainGrad)"/>

  <!-- Train roof -->
  <rect x="6" y="2" width="16" height="4" rx="2" fill="url(#roofGrad)"/>

  <!-- Main window with frosted glass effect -->
  <rect x="7" y="8" width="14" height="7" rx="1.5" fill="#fff" opacity="0.9"/>
  <rect x="7" y="8" width="14" height="3" rx="1.5" fill="#c4b5fd" opacity="0.3"/>

  <!-- Destination board -->
  <rect x="9" y="17" width="10" height="3" rx="1" fill="#1e1b4b" opacity="0.6"/>

  <!-- Headlights with teal glow -->
  <circle cx="9" cy="23" r="2.5" fill="#14b8a6" opacity="0.4"/>
  <circle cx="9" cy="23" r="1.5" fill="#fff"/>
  <circle cx="19" cy="23" r="2.5" fill="#14b8a6" opacity="0.4"/>
  <circle cx="19" cy="23" r="1.5" fill="#fff"/>

  <!-- Clock overlay with gradient ring -->
  <circle cx="24" cy="8" r="7" fill="url(#clockGrad)"/>
  <circle cx="24" cy="8" r="5.5" fill="#fff"/>
  <line x1="24" y1="8" x2="24" y2="4.5" stroke="#7c3aed" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="8" x2="27" y2="8" stroke="#14b8a6" stroke-width="1.2" stroke-linecap="round"/>
  <circle cx="24" cy="8" r="0.8" fill="#7c3aed"/>
</svg>
